        // This func prevents stale features from displaying when there's no new tile at new zoom level
        var tileLoadFunction = function(tile, url) {
            tile.setLoader(function(extent, resolution, projection) {
                fetch(url).then(function(response) {
                    if (response.status === 200) {
                        const contentLength = response.headers.get('content-length');
                        if (contentLength === '0') {
                            // Handle 0-byte files
                            return Promise.resolve(new ArrayBuffer(0));
                        }
                        return response.arrayBuffer();
                    } else {
                        // Handle missing files
                        return Promise.resolve(new ArrayBuffer(0));
                    }
                }).then(function(data) {
                    if (data && data.byteLength > 0) {
                        try {
                            const format = new ol.format.MVT(); // Use MVT format directly
                            const features = format.readFeatures(data, {
                                extent: extent,
                                featureProjection: projection
                            });
                            tile.setFeatures(features);
                        } catch (parseError) {
                            console.log('Parse error for tile:', url, parseError);
                            tile.setFeatures([]);
                        }
                    } else {
                        // Empty data - set empty features
                        tile.setFeatures([]);
                    }
                }).catch(function(error) {
                    console.log('Tile load error:', url, error);
                    tile.setFeatures([]);
                });
            });
        };

function drawLineToParent(feature) {
    // Clear previous line
      if (currentLineFeature) {
        tempLineSource.removeFeature(currentLineFeature);
        currentLineFeature = null;
      }
    const properties = feature.properties_;
    
    if (properties && properties.px && properties.py) {
      // Get the feature's coordinates from flatCoordinates_
      const featureCoords = feature.flatCoordinates_; // Direct access to coordinates
      const parentCoords = [properties.px, properties.py]
        const lineGeometry = new ol.geom.LineString([parentCoords, featureCoords]);
        currentLineFeature = new ol.Feature({
          geometry: lineGeometry
        });
        tempLineSource.addFeature(currentLineFeature);
    }
}
function drawPolygon(feature) {
    if (currentPolygonFeature) {
        tempLineSource.removeFeature(currentPolygonFeature);
        currentPolygonFeature = null;
    }
    
    const properties = feature.properties_;
    
    if (properties && properties.polygon) {
        try {
            const polygonString = properties.polygon;
            const coordsString = polygonString.replace('POLYGON ((', '').replace('))', '');
            const coordPairs = coordsString.split(', ');
            const coordinates = coordPairs.map(pair => {
                const [x, y] = pair.split(' ').map(Number);
                return [x, y];
            });
            
            const polygonGeometry = new ol.geom.Polygon([coordinates]);
            currentPolygonFeature = new ol.Feature({
                geometry: polygonGeometry
            });
            
            tempLineSource.addFeature(currentPolygonFeature);
        } catch (error) {
            console.error('Error parsing polygon:', error);
        }
    }
}

    const pixel = map.getEventPixel(evt.originalEvent || evt);

        }

});

    const mapElement = document.getElementById('map');

    // Position at center top
    const left = mapRect.left + (mapRect.width / 2);
    const top = mapRect.top + 20;
    
    contextMenu.style.left = left + 'px';
    contextMenu.style.top = top + 'px';
    contextMenu.style.transform = 'translateX(-50%)'; // Move left by 50% of own width
    contextMenu.style.display = 'block';
}

// Fetches Wikidata and updates the existing context menu if successful
async function fetchAndApplyWikidata(taxonId, featureProps) {
    const placeholder = document.getElementById('wd-status-placeholder');
    try {
        console.log("Fetching Wikidata for ID:", taxonId);
        
        placeholder.textContent = 'Loading Wikidata...'
        
        const wikidataData = await fetchWikidataResources(taxonId);

        if (wikidataData && (wikidataData.image || (wikidataData.externalResources && wikidataData.externalResources.length > 0))) {
            console.log("Wikidata fetched successfully, updating menu:", wikidataData);
            // Update the *existing* menu content with WD data
            displayCombinedData(featureProps, wikidataData); // This will re-render the content, now including WD parts
            placeholder.textContent = ''
        } else {
             console.log("Wikidata fetched, but no relevant data (image/resources) found.");
             placeholder.textContent = 'No wikidata for this taxon.'
        }
    } catch (error) {
        console.error("Error fetching or applying Wikidata:", error);
        // Silently fail - the initial feature data is already displayed.
        
    }
}

function getExternalResourcesHtml(externalResources) {
    if (externalResources.length === 0) return '';
    
    const links = externalResources.map(resource => {
        const formattedName = resource.name
            .replace(/_/g, ' ')
            .replace(/\b\w/g, l => l.toUpperCase());
        return `<a href="${resource.url}" target="_blank">${formattedName}</a>`;
    });
    
    return `<div style="margin: 0.5rem 0;"><strong>Resources:</strong> ${links.join(' | ')}</div>`;
}

// Generate thumbnail URL from Wikimedia Commons image using proper MD5
function getThumbnailUrl(imageUrl, thumbSize = 160) {
    try {
        // Extract filename from URL
        const url = new URL(imageUrl);
        const pathParts = url.pathname.split('/');
        const filename = decodeURIComponent(pathParts[pathParts.length - 1]);
        
        // Get proper MD5 hash using the imported library
        const title = filename.replace(/^File:/, '').replace(/ /g, '_');
        const hash = md5(title); // Using the imported md5 function
        
        const hashPrefix1 = hash.substring(0, 1);
        const hashPrefix2 = hash.substring(0, 2);
        
        return `https://upload.wikimedia.org/wikipedia/commons/thumb/${hashPrefix1}/${hashPrefix2}/${encodeURIComponent(title)}/${thumbSize}px-${encodeURIComponent(title)}`;
        
    } catch (error) {
        console.error('Error generating thumbnail URL:', error);
        return imageUrl; // Fallback to original image
    }
}
// Fetch Wikidata resources using SPARQL
async function fetchWikidataResources(taxonId) {
    try {
        const lang = typeof window.lang !== 'undefined' ? window.lang : 'en';
        const wikiLang = (lang === 'en' || lang === 'ru') ? lang : 'en';
        
        const sparqlQuery = `
            SELECT ?obj ?name ?url WHERE {
			  # P846=GBIF, P685=NCBI, P815=ITIS
              ?obj wdt:P815 '${taxonId}' .
              {
                ?obj wdt:P18 ?url.
                BIND("img" AS ?name)
              }
              UNION {
                ?obj wdt:P10585 ?id.
                wd:P10585 wdt:P1630 ?formatter.
                BIND(IRI(REPLACE(?id, "(^.*)", ?formatter)) AS ?url)
                BIND("CoL" AS ?name)
              }
              UNION {
                ?obj wdt:P685 ?id.
                wd:P685 wdt:P1630 ?formatter.
                BIND(IRI(REPLACE(?id, "(^.*)", ?formatter)) AS ?url)
                BIND("NCBI" AS ?name)
              }
              UNION {
                ?obj wdt:P685 ?id.
                BIND(IRI(CONCAT('https://lifemap.cnrs.fr/tree?efficiency-mode=true&tid=', ?id)) AS ?url)
                BIND("LifeMap" AS ?name)
              }
              #UNION
              #{
              #  ?obj wdt:P815 ?id.
              #  wd:P815 wdt:P1630 ?formatter.
              #  BIND(IRI(REPLACE(?id, "(^.*)", ?formatter)) AS ?url)
              #  BIND("ITIS" AS ?name)
              #}
              UNION
              {
                ?obj wdt:P3151 ?id.
                wd:P3151 wdt:P1630 ?formatter.
                BIND(IRI(REPLACE(?id, "(^.*)", ?formatter)) AS ?url)
                BIND("iNatur" AS ?name)
              }
              UNION
              {
                ?obj wdt:P9157 ?id.
                wd:P9157 wdt:P1630 ?formatter.
                BIND(IRI(REPLACE(?id, "(^.*)", ?formatter)) AS ?url)
                BIND("OTT" AS ?name)
              }
              UNION
              {
                ?obj wdt:P9157 ?id.
                wd:P9157 wdt:P1630 ?formatter.
                BIND (URI(CONCAT("https://www.onezoom.org/life/@=", ?id, "?vis=polytomy")) AS ?url)
                BIND("OneZoom" AS ?name)
              }
              UNION
              {
                ?url schema:about ?obj;
                  schema:isPartOf <https://${wikiLang}.wikipedia.org/>.
                BIND("${wikiLang}Wiki" AS ?name)
              }
              UNION {
                ?obj wdt:P373 ?categLabel .
                BIND (URI(CONCAT("https://commons.wikimedia.org/wiki/Category:", ?categLabel)) AS ?url)
                BIND("wcCateg" AS ?name)
              }
              UNION {
                ?obj wdt:P373 ?categLabel .
                BIND("wcImages" AS ?name)
                BIND (ENCODE_FOR_URI(CONCAT("deepcategory:\\"", ?categLabel, "\\"")) AS ?query)
                BIND (URI(CONCAT("https://commons.wikimedia.org/w/index.php?search=", ?query, "&title=Special:MediaSearch&type=image")) AS ?url)
              }
            }
        `;
        
        const url = 'https://query.wikidata.org/sparql?query=' + encodeURIComponent(sparqlQuery) + '&format=json';
        const response = await fetch(url, {
            headers: {
                'Accept': 'application/sparql-results+json'
            }
        });
        
        const data = await response.json();
        return processWikidataResults(data);
        
    } catch (error) {
        console.error('Error fetching Wikidata:', error);
        return { image: null, wikipedia: null, col: null };
    }
}
// Returns object with processed Wikidata SPARQL results
function processWikidataResults(data) {
    const result = { 
        image: null,
        externalResources: []
    };
    
    if (data && data.results && data.results.bindings[0]) {
        result.externalResources.push({
                    name: 'WD',
                    url: data.results.bindings[0].obj.value
                });
        data.results.bindings.forEach(binding => {
            if (binding.name && binding.url) {
                const name = binding.name.value;
                const url = binding.url.value;
                
                if (name === 'img') {
                    result.image = url;
                } else {
                    result.externalResources.push({
                        name: name,
                        url: url
                    });
                }
            }
        });
    }
    
    return result;
}


// THis func should be equivalent to Java similar func
function getColorRgb(input, pastelFactor = 1.0, alpha = 1.0) {
    if (input == null) {return 'black'}
    // Generate MD5 hash using blueimp-md5
    const md5Hash = md5(input.toString());
    
    // Convert hex string to bytes
    const hashBytes = [];
    for (let i = 0; i < md5Hash.length; i += 2) {
        hashBytes.push(parseInt(md5Hash.substr(i, 2), 16));
    }

    // Use bytes for RGB components (similar to Java version)
    let r = hashBytes[0];
    let g = hashBytes[4];  // Using spaced-out indices like in Java
    let b = hashBytes[8];

    if (pastelFactor < 1.0) {
        // Convert to pastel by mixing with white
        r = Math.floor(r * pastelFactor + 255 * (1 - pastelFactor));
        g = Math.floor(g * pastelFactor + 255 * (1 - pastelFactor));
        b = Math.floor(b * pastelFactor + 255 * (1 - pastelFactor));
    }

    // Return rgba string if alpha is not 1.0, otherwise return hex
    if (alpha < 1.0) {
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    // Convert to hex string
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}
