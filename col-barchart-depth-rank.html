<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Stacked Bar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    
    #chart-container {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    
    .chart-legend {
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 5px;
      transition: all 0.2s;
    }
    
    .legend-item:hover {
      background: #f0f0f0;
    }
    
    .legend-item.hidden {
      opacity: 0.5;
      text-decoration: line-through;
    }
    
    .legend-color {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      border-radius: 3px;
    }
  </style>
</head>

        <pre>Invoke-CypherNeo4j @&#39;

RETURN n.depth AS depth, n.taxonRank AS rank, count(*) AS count
ORDER BY depth, count DESC

    // Property names
    const propertyNames = {"series":"rank","y":"count","x":"depth"};

    // Generate random colors
    function getRandomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsla(${hue}, 70%, 60%, 0.8)`;
    }

    // Generate the stacked bar chart
    function createStackedBarChart(data, xProp, yProp, seriesProp) {
      const ctx = document.getElementById('bar-chart').getContext('2d');
      const legendContainer = document.getElementById('legend-container');
      
      // Get unique series groups and labels
      const seriesGroups = [...new Set(data.map(item => item[seriesProp]))];
      const labels = [...new Set(data.map(item => item[xProp]))];

      // Prepare datasets with random colors
      const datasets = seriesGroups.map((group, i) => {
        return {
          label: group,
          data: labels.map(label => {
            const item = data.find(d => d[xProp] === label && d[seriesProp] === group);
            return item ? item[yProp] : 0;
          }),
          backgroundColor: getRandomColor(),
          borderColor: 'rgba(0,0,0,0.2)',
          borderWidth: 1,
          hidden: false
        };
      });

      const chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { 
              stacked: true,
              title: { display: true, text: xProp }
            },
            y: { 
              stacked: true,
              title: { display: true, text: yProp },
              beginAtZero: true
            }
          },
          plugins: {
            legend: {
              display: false
            }
          }
        }
      });

      // Create interactive legend
      function updateLegend() {
        legendContainer.innerHTML = datasets.map((dataset, i) => {
          const isHidden = chart.getDatasetMeta(i).hidden;
          return `
            <div class="legend-item ${isHidden ? 'hidden' : ''}" 
                 data-index="${i}" 
                 style="background: ${isHidden ? '#f8f8f8' : 'transparent'}">
              <div class="legend-color" style="background: ${dataset.backgroundColor}"></div>
              <span>${dataset.label}</span>
            </div>
          `;
        }).join('');

        // Add click handlers
        document.querySelectorAll('.legend-item').forEach(item => {
          item.addEventListener('click', () => {
            const index = item.dataset.index;
            const meta = chart.getDatasetMeta(index);
            meta.hidden = !meta.hidden;
            chart.update();
            updateLegend();
          });
        });
      }

      // Initialize legend
      updateLegend();
      
      // Handle window resize
      window.addEventListener('resize', function() {
        chart.resize();
      });
    }

    // Initialize the chart
    createStackedBarChart(inputData, propertyNames.x, propertyNames.y, propertyNames.series);
  </script>
