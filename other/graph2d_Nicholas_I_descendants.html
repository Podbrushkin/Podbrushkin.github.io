      function startNetwork(data) {
        const container = document.getElementById("mynetwork");
        const options = {
			physics:{
				stabilization: false	// fast but shaky startup
		   },
		   nodes: {
		   shape: 'dot',
			scaling: {
				min: 10,
				max: 30,
				label: {
					enabled: true,
					min: 14,
					max: 30,
				},
			},
		   },
			edges: {
				arrows: {
				  to: {
					enabled: true,
				  }
				},
				arrowStrikethrough: true,
			  },
			configure: {
				filter: function (option, path) {
				  return path.indexOf('physics') !== -1;
				},
				container: document.getElementById('configuration'),
			}
		};
        network = new vis.Network(container, data, options);
      }

      /**
       * filter values are updated in the outer scope.
       * in order to apply filters to new values, DataView.refresh() should be called
       */
      
	  
      const edgesFilterValues = {
	  //edgesFilterValues_START
"HAS_CHILD": true,
		//END
      };
	  const nodesFilterValues = {
	  //nodesFilterValues_START
"": true,
		//END
      };

      const edgesFilter = (edge) => {
        return !edge.group || edgesFilterValues[edge.group];
      };
	  const nodesFilter = (node) => {
        return !node.group || nodesFilterValues[node.group];
      };

      const nodesView = new vis.DataView(nodes, { filter: nodesFilter });
      const edgesView = new vis.DataView(edges, { filter: edgesFilter });

      

      edgeFilters.forEach((filter) =>
        filter.addEventListener("change", (e) => {
          const { value, checked } = e.target;
          edgesFilterValues[value] = checked;
          edgesView.refresh();
        })
      );
	  nodeFilters.forEach((node) =>
        node.addEventListener("change", (e) => {
          const { value, checked } = e.target;
          nodesFilterValues[value] = checked;
          nodesView.refresh();
        })
      );

      startNetwork({ nodes: nodesView, edges: edgesView });

	function changeLabelColor() {
	  let randomColor = '#'+(Math.random()*0xFFFFFF<<0).toString(16);
      nodes.forEach(function(node) {
        node.font = { color: randomColor };
      });
      nodes.update(nodes.get());
    }
	function ebableNodeLocking() {
		network.on("dragEnd", function (params) {
		  for (var i = 0; i < params.nodes.length; i++) {
			  var nodeId = params.nodes[i];
			  nodes.update({id: nodeId, fixed: {x: true, y: true}});
		  }
		});
		network.on('dragStart', function(params) {
		  for (var i = 0; i < params.nodes.length; i++) {
			  var nodeId = params.nodes[i];
			  nodes.update({id: nodeId, fixed: {x: false, y: false}});
		  }
		});
		network.on('doubleClick', function(params) {
		  for (var i = 0; i < params.nodes.length; i++) {
			  var nodeId = params.nodes[i];
			  nodes.update({id: nodeId, fixed: {x: false, y: false}});
		  }
		});
