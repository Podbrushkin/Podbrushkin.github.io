<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery-container {
            margin-top: 20px;
        }
        .image-card {
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }
        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .image-card:hover img {
            transform: scale(1.03);
        }
        .tag-filters {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .tag-group {
            margin-bottom: 15px;
        }
        .tag-group h5 {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 5px;
            font-size: 1rem;
        }
        .hidden {
            display: none;
        }
        .controls {
            margin-bottom: 20px;
        }
        .cell-size-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-check-input.exclude {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        //.form-check-input:not(.exclude) {
        //    background-color: transparent;
        //}
        .custom-tooltip {
            --bs-tooltip-bg: rgba(0, 0, 0, 0.85);
            --bs-tooltip-max-width: 300px;
        }
        .compact-info {
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .compact-info strong {
            display: inline-block;
            min-width: 60px;
        }
    </style>
</head>
<body>
    <div class="container-fluid gallery-container">
        <div class="controls">
            <div class="row">
                <div class="col-md-8">
                    <div class="tag-filters">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="m-0">Filter by Tags</h4>
                            <button id="resetFilters" class="btn btn-sm btn-outline-secondary">Reset All</button>
                        </div>
                        <div id="tagGroups" class="row"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="cell-size-control card p-3">
                        <label for="cellSizeSlider" class="form-label">Cell Size</label>
                        <input type="range" class="form-range" min="100" max="400" value="200" id="cellSizeSlider">
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="gallery"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

            ;

            // Extract all tag groups
            const tagGroups = {};
            
            images.forEach(image => {
                image.tagGroups.forEach(group => {
                    if (!tagGroups[group.name]) {
                        tagGroups[group.name] = new Set();
                    }
                    group.tags.forEach(tag => tagGroups[group.name].add(tag));
                });
            });

            // Render tag filter groups
            const tagGroupsContainer = $('#tagGroups');
            Object.entries(tagGroups).forEach(([groupName, tagsSet]) => {
                const tags = Array.from(tagsSet).sort();
                const groupId = `group-${groupName.replace(/\s+/g, '-')}`;
                
                const groupHtml = `
                    <div class="col-md-3 tag-group">
                        <h5>${groupName.charAt(0).toUpperCase() + groupName.slice(1)}</h5>
                        ${tags.map(tag => `
                            <div class="form-check">
                                <input class="form-check-input tag-checkbox" type="checkbox" 
                                    id="${groupId}-${tag.replace(/\s+/g, '-')}" 
                                    data-group="${groupName}" 
                                    value="${tag}"
                                    data-state="neutral">
                                <label class="form-check-label" for="${groupId}-${tag.replace(/\s+/g, '-')}">
                                    ${tag}
                                </label>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                tagGroupsContainer.append(groupHtml);
            });

            // Render gallery with initial cell size
            let cellSize = 200;
            const gallery = $('#gallery');
            
            function renderGallery() {
                gallery.empty();
                gallery.css('--cell-size', `${cellSize}px`);
                
                images.forEach((image, index) => {
                    const allTags = [];
                    image.tagGroups.forEach(group => {
                        group.tags.forEach(tag => allTags.push(`${group.name}:${tag}`));
                    });
                    
                    // Create compact info for tooltip
                    const compactInfo = [];
                    if (image.action) {
                        compactInfo.push(`<strong>Action:</strong> ${image.action}`);
                    }
                    image.tagGroups.forEach(group => {
                        if (group.tags.length > 0) {
                            compactInfo.push(`<strong>${group.name}:</strong> ${group.tags.join(', ')}`);
                        }
                    });
                    
                    const card = $(`
                        <div class="col-lg-2 col-md-3 col-sm-4 col-6 image-card" 
                             data-tags="${allTags.join(',')}"
                             data-index="${index}"
                             style="height: var(--cell-size)">
                            <img src="${image.url}" class="img-fluid" 
                                 data-bs-toggle="tooltip" 
                                 data-bs-html="true"
                                 title="<div class='compact-info'>${compactInfo.join('<br>')}</div>">
                        </div>
                    `);
                    
                    if (image.action) {
                        card.on('click', () => window.open(image.action, '_blank'));
                    }
                    
                    gallery.append(card);
                });
                
                // Initialize tooltips with custom class
                $('[data-bs-toggle="tooltip"]').tooltip({
                    trigger: 'hover',
                    placement: 'auto',
                    template: '<div class="tooltip custom-tooltip" role="tooltip"><div class="tooltip-inner"></div></div>'
                });
            }
            
            renderGallery();

            // Filter functionality
            const filterImages = () => {
                const includedTags = {};
                const excludedTags = {};
                
                // Get selected tags
                $('.tag-checkbox').each(function() {
                    const group = $(this).data('group');
                    const value = $(this).val();
                    const state = $(this).data('state');
                    
                    if (state === 'include') {
                        if (!includedTags[group]) {
                            includedTags[group] = [];
                        }
                        includedTags[group].push(value);
                    } else if (state === 'exclude') {
                        if (!excludedTags[group]) {
                            excludedTags[group] = [];
                        }
                        excludedTags[group].push(value);
                    }
                });
                
                // If no filters are set, show all images
                if (Object.keys(includedTags).length === 0 && Object.keys(excludedTags).length === 0) {
                    $('.image-card').removeClass('hidden');
                    return;
                }
                
                // Filter images
                $('.image-card').each(function() {
                    const imageTags = $(this).data('tags').split(',');
                    let shouldShow = true;
                    
                    // Check included tags (must have ALL tags from each included group)
                    for (const group in includedTags) {
                        const hasAllTags = includedTags[group].every(tag => 
                            imageTags.includes(`${group}:${tag}`)
                        );
                        
                        if (!hasAllTags) {
                            shouldShow = false;
                            break;
                        }
                    }
                    
                    // Check excluded tags (must not have ANY excluded tags)
                    if (shouldShow) {
                        for (const group in excludedTags) {
                            const hasAnyExcludedTag = excludedTags[group].some(tag => 
                                imageTags.includes(`${group}:${tag}`)
                            );
                            
                            if (hasAnyExcludedTag) {
                                shouldShow = false;
                                break;
                            }
                        }
                    }
                    
                    if (shouldShow) {
                        $(this).removeClass('hidden');
                    } else {
                        $(this).addClass('hidden');
                    }
                });
            };
            
            // Tri-state checkbox functionality (neutral <-> exclude)
            //$('.tag-checkbox').on('mousedown', function(e) {
            //    if (e.ctrlKey || e.metaKey) {
            //        e.preventDefault();
            //        const currentState = $(this).data('state');
            //        const nextState = currentState === 'exclude' ? 'neutral' : 'exclude';
            //        
            //        $(this)
            //            .data('state', nextState)
            //            .toggleClass('exclude', nextState === 'exclude')
            //            .prop('checked', false);
            //        
            //        filterImages();
            //        return false;
            //    }
            //});
            
            // Regular checkbox functionality (neutral -> include)
            $('.tag-checkbox').on('click', function(e) {
                console.log(e.ctrlKey)
                if (!(e.ctrlKey || e.metaKey)) {
                console.log('no ctrl')
                    $(this)
                        .data('state', $(this).is(':checked') ? 'include' : 'neutral')
                        .removeClass('exclude');
                    filterImages();
                } else {
                    console.log('yes ctrl')
                    e.preventDefault();
                    const currentState = $(this).data('state');
                    const nextState = currentState === 'exclude' ? 'neutral' : 'exclude';
                    
                    $(this)
                        .data('state', nextState)
                        .toggleClass('exclude', nextState === 'exclude')
                        .prop('checked', false);
                    
                    filterImages();
                    return false;
                
                }
            });
            
            // Reset filters
            $('#resetFilters').click(function() {
                $('.tag-checkbox')
                    .prop('checked', false)
                    .data('state', 'neutral')
                    .removeClass('exclude');
                filterImages();
            });
            
            // Cell size slider
            $('#cellSizeSlider').on('input', function() {
                cellSize = parseInt($(this).val());
                renderGallery();
            });
        });
    </script>
