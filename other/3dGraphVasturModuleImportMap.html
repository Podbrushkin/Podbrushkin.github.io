<!DOCTYPE html>
<html lang="en">
<head>
  <style> body { margin: 0; } </style>

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.138.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.138.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/controls/DragControls": "https://unpkg.com/three@0.138.0/examples/jsm/controls/DragControls.js",
        "three/examples/jsm/loaders/GLTFLoader": "https://unpkg.com/three@0.138.0/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/loaders/DRACOLoader": "https://unpkg.com/three@0.138.0/examples/jsm/loaders/DRACOLoader.js"
      }
    }
  </script>

  <!-- Load 3d-force-graph as an ES module -->
  <script type="module">
    import ForceGraph3D from 'https://unpkg.com/3d-force-graph/dist/3d-force-graph.min.js';

    // Example data with nodes and edges
    const data = {
      nodes: [
        { id: 1, type: 'type1', url: 'https://example.com/node1' },
        { id: 2, type: 'type2', url: 'https://example.com/node2' },
        { id: 3, type: 'type1', url: 'https://example.com/node3' },
        // Add more nodes as needed
      ],
      edges: [
        { source: 1, target: 2, type: 'typeA' },
        { source: 2, target: 3, type: 'typeB' },
        // Add more edges as needed
      ]
    };

    // Initialize the graph
    const Graph = ForceGraph3D(document.getElementById('3d-graph'))
      .nodeAutoColorBy('type') // Auto-color nodes by their 'type' property
      .linkAutoColorBy(d => data.edges.find(edge => edge.source === d.source && edge.target === d.target).type) // Auto-color links by their 'type' property
      .linkOpacity(0.5)
      .onNodeClick(node => {
        if (node.url) {
          window.open(node.url, '_blank'); // Open URL in a new tab if it exists
        }
      })
      .graphData(data);
  </script>
</head>

<body>
  <div id="3d-graph"></div>
</body>
</html>
