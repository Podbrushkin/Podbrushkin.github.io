<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Line Chart with Sliders</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #chartContainer {
            width: 80%;
            margin: auto;
            transition: height 0.3s ease;
        }
        .sliders {
            margin-top: 20px;
        }
		.slider {
			width: 80%;
		}
        .slider-container {
            margin-bottom: 10px;
        }
        .slider-container label {
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>
	<details>
        <summary>Details</summary>
        <pre>Invoke-CypherNeo4j @&#39;
MATCH (n)
RETURN n.depth AS depth, n.taxonRank AS rank, count(*) AS count
ORDER BY depth, count DESC
&#39;@ | Format-HtmlLineChart -XProperty depth -YProperty count -SeriesProperty rank -Description (gcb -Raw)</pre>
    </details>
    <div id="chartContainer">
        <canvas id="lineChart"></canvas>
    </div>

    <div class="sliders">
        <div class="slider-container">
            <label for="minX">Min X:</label>
            <input type="range" id="minX" min="0" max="100" value="0" class="slider">
            <span id="minXValue">0</span>
        </div>
        <div class="slider-container">
            <label for="maxX">Max X:</label>
            <input type="range" id="maxX" min="0" max="100" value="100" class="slider">
            <span id="maxXValue">100</span>
        </div>
        <div class="slider-container">
            <label for="minY">Min Y:</label>
            <input type="range" id="minY" min="0" max="100" value="0" class="slider">
            <span id="minYValue">0</span>
        </div>
        <div class="slider-container">
            <label for="maxY">Max Y:</label>
            <input type="range" id="maxY" min="0" max="100" value="100" class="slider">

    </div>

        // Group data by series
        const groupedData = {};
        data.forEach(item => {
            const series = item.Series;
            if (!groupedData[series]) {
                groupedData[series] = [];
            }
            groupedData[series].push({
                x: item.X,
                y: item.Y
            });
        });

        // Prepare datasets for Chart.js
        const datasets = Object.keys(groupedData).map(series => {
            return {
                label: series,
                data: groupedData[series],
                borderColor: '#' + Math.floor(Math.random()*16777215).toString(16), // Random color
                fill: false
            };
        });

        // Create the chart
        const ctx = document.getElementById('lineChart').getContext('2d');
        const lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: datasets
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: {
                            display: true,
                            text: 'Year'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Value'
                        }
                    }
                }
            }
        });

        // Get slider elements
        const minXSlider = document.getElementById('minX');
        const maxXSlider = document.getElementById('maxX');
        const minYSlider = document.getElementById('minY');
        const maxYSlider = document.getElementById('maxY');
        const chartHeightSlider = document.getElementById('chartHeight');

        // Get slider value display elements
        const minXValue = document.getElementById('minXValue');
        const maxXValue = document.getElementById('maxXValue');
        const minYValue = document.getElementById('minYValue');
        const maxYValue = document.getElementById('maxYValue');

        // Initialize slider values based on data
        const xValues = data.map(item => item.X);
        const yValues = data.map(item => item.Y);
        const minXData = Math.min(...xValues);
        const maxXData = Math.max(...xValues);
        const minYData = Math.min(...yValues);
        const maxYData = Math.max(...yValues);

        minXSlider.min = minXData;
        minXSlider.max = maxXData;
        minXSlider.value = minXData;
        maxXSlider.min = minXData;
        maxXSlider.max = maxXData;
        maxXSlider.value = maxXData;
        minYSlider.min = minYData;
        minYSlider.max = maxYData;
        minYSlider.value = minYData;
        maxYSlider.min = minYData;
        maxYSlider.max = maxYData;
        maxYSlider.value = maxYData;

        minXValue.textContent = minXData;
        maxXValue.textContent = maxXData;
        minYValue.textContent = minYData;
        maxYValue.textContent = maxYData;

        // Update chart scales when sliders change
        minXSlider.addEventListener('input', () => {
            lineChart.options.scales.x.min = Math.round(minXSlider.value);
            lineChart.update();
            minXValue.textContent = minXSlider.value;
        });

        maxXSlider.addEventListener('input', () => {
            lineChart.options.scales.x.max = Math.round(maxXSlider.value);
            lineChart.update();
            maxXValue.textContent = maxXSlider.value;
        });

        minYSlider.addEventListener('input', () => {
            lineChart.options.scales.y.min = Math.round(minYSlider.value);
            lineChart.update();
            minYValue.textContent = minYSlider.value;
        });

        maxYSlider.addEventListener('input', () => {
            lineChart.options.scales.y.max = Math.round(maxYSlider.value);
            lineChart.update();
            maxYValue.textContent = maxYSlider.value;
        });
