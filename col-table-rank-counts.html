function matchAny(data, filterParams) {
	  //data - the data for the row being filtered
	  //filterParams - params object passed to the filter
	  //RegExp - modifier "i" - case insensitve

	var match = false;
	const regex = RegExp(filterParams.value, 'i');

	for (var key in data) {
		if (regex.test(data[key]) == true) {
			match = true;
		}
	}
	return match;
}
const input = document.getElementById("fSearch");
input.addEventListener("keyup", function() {
	table.setFilter(matchAny, { value: input.value });
	if (input.value == " ") {
		table.clearFilter()
	}
});

function urlFormatter(cell, formatterParams, onRendered){
	return "<a href='" + cell.getValue() + "' target='_blank'>" + cell.getValue() + "</a>";
}
function qidFormatter(cell, formatterParams, onRendered){
	if (cell.getValue()) {
		return "<a href='https://www.wikidata.org/wiki/" + cell.getValue() + "' target='_blank'>" + cell.getValue() + "</a>";
	} else {return null}
}
function urlQidFormatter(cell, formatterParams, onRendered){
	if (cell.getValue() != null) {
		return "<a href='" + cell.getValue() + "' target='_blank'>" + cell.getValue().substring(31) + "</a>";
	} else {return null}
}
var rowPopupFormatter = function(e, row, onRendered){
	var data = row.getData(),
	container = document.createElement("pre"),
	contents = JSON.stringify(data, null, '\t');
	container.innerHTML = contents;
	return container;
}
function htmlFormatter(cell, formatterParams, onRendered) {
    // Render the cell value as HTML
    return cell.getValue();
}

var table = new Tabulator("#example-table", {
 height:"90vh",
 layout:"fitColumns",
 data: data,
 autoColumns: "full",
 });
 
function applyColumnFormatters() {
    let columns = table.getColumnDefinitions();
    let dataTmp = table.getData();
    console.log('dataTmp.length=' + dataTmp.length);
    for (let i = 0; i < columns.length; i++) {
        let columnName = columns[i].field;
        if (columnName === "url") {
            columns[i].formatter = urlFormatter;
            continue;
        }
        const randomIndex = Math.floor(Math.random() * dataTmp.length);
        let sampleVal = dataTmp.map(x => x[columnName]).find(val => val !== null && val !== undefined && val !== '');
        //console.log(columnName + ':' + sampleVal);
        if (typeof sampleVal === "string" && sampleVal.startsWith("http")) {
            columns[i].formatter = urlFormatter;
        }
		if (typeof sampleVal === "string" && sampleVal.startsWith("<a href")) {
            columns[i].formatter = htmlFormatter;
        }
    }
    table.setColumns(columns);
}

table.on("tableBuilt", applyColumnFormatters);
